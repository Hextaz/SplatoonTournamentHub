name: CI Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-bot:
    name: Validate Bot (TS & Build)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./bot
        run: npm ci

      - name: 🧪 Run Unit Tests (Vitest)
        working-directory: ./bot
        run: npm run test

      - name: 🛠️ Run TypeScript compilation (build)
        working-directory: ./bot
        run: npm run build

  validate-web:
    name: Validate Web (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./web
        run: npm ci

      - name: 🛠️ Run Lint & Next.js Build
        working-directory: ./web
        run: npm run build
