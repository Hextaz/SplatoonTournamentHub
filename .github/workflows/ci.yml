name: CI Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-monorepo:
    name: Validate Monorepo (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Build Shared Package
        run: cd packages/shared && npm run build

      - name: 🧪 Run Unit Tests
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy_key_for_ci
        run: npm run test

      - name: 🛠️ Build Apps (Bot & Web)
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy_key_for_ci
        run: npm run build
