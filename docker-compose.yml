version: "3.8"

services:
  bot-dev:
    container_name: splatoon_bot_dev
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
      target: builder
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    network_mode: "host"
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  web-dev:
    container_name: splatoon_web_dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: builder
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    network_mode: "host"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
