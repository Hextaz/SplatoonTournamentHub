services:
  bot-dev:
    container_name: tournament_bot_dev
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: builder
    command: npm run dev --workspace=@hub/bot
    volumes:
      - .:/app
      - /app/node_modules
    network_mode: "host"
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  web-dev:
    container_name: tournament_web_dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    command: npm run dev --workspace=@hub/web
    volumes:
      - .:/app
      - /app/node_modules
    network_mode: "host"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
